[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ix-zero"
version = "3.0.0"
description = "Experimental continual neural-symbolic cognition and cumulative skill acquisition"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ix-zero = "ix_zero.cli:main"
ix-zero-hybrid = "ix_zero.hybrid_cli:main"
ix-zero-continual = "ix_zero.continual_cli:main"

[tool.setuptools]
packages = ["ix_zero", "ix_zero._ix_vendor", "ix_zero._sally_vendor", "ix_zero._sally_vendor.cognition"]

[tool.setuptools.package-data]
ix_zero = ["policies/*.ix"]
"ix_zero._ix_vendor" = ["LICENSE"]
"ix_zero._sally_vendor" = ["LICENSE"]
